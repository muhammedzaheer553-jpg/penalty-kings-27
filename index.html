
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penalty Kings 27</title>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"}}
</script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#06130e;color:white;font-family:Arial,sans-serif}
#game{position:fixed;inset:0}
canvas{width:100%;height:100%;display:block}
.panel{position:fixed;z-index:2;background:#07180fe8;border:1px solid #ffffff30;
border-radius:12px;padding:10px;box-shadow:0 4px 20px #0006}
#header{top:10px;left:50%;transform:translateX(-50%);text-align:center;min-width:260px}
#title{font-weight:900;letter-spacing:2px;font-size:15px}
#score{font-size:30px;font-weight:900;margin:4px}
#round{font-size:12px;color:#c4e6d0}
#teams{top:10px;left:10px;width:165px}
#opponent{top:10px;right:10px;width:165px}
select,button{border:0;border-radius:8px;padding:10px;font-weight:bold;cursor:pointer}
select{width:100%;margin:5px 0;background:#f2f5f2;color:#14231a}
button{background:#eaf3ec;color:#13251a;margin:3px}
button:disabled{opacity:.35;cursor:not-allowed}
.green{background:#39e878}
#controls{bottom:10px;left:50%;transform:translateX(-50%);width:min(520px,96vw);text-align:center}
#status{font-size:15px;font-weight:bold;min-height:20px;margin:4px}
#instruction{font-size:12px;color:#c7e2d0;min-height:17px}
#power{width:100%;accent-color:#39e878}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:5px}
.grid button{margin:0;padding:10px 4px;min-height:39px}
#defendControls{display:none}
.small{font-size:12px;color:#d0e7d7;line-height:1.6}
@media(max-width:600px){
 #teams,#opponent{top:auto;bottom:205px;width:135px;padding:7px}
 #teams{left:5px}#opponent{right:5px}
 #header{top:5px;min-width:205px;padding:7px}
 #title{font-size:12px}#score{font-size:24px}
 #controls{bottom:5px;padding:7px}
 button{font-size:11px;padding:8px 4px}
 .grid button{font-size:10px}
}
</style>
</head>
<body>
<div id="game"></div>

<div id="header" class="panel">
 <div id="title">⚽ PENALTY KINGS 27</div>
 <div id="score">0 - 0</div>
 <div id="round">PENALTY SHOOTOUT · ROUND 1 / 5</div>
</div>

<div id="teams" class="panel">
 <b>YOUR TEAM</b>
 <select id="myTeam">
  <option>FC Barcelona</option><option>Real Madrid</option>
  <option>Manchester City</option><option>Liverpool</option>
  <option>Argentina</option><option>Brazil</option>
  <option>France</option><option>Portugal</option><option>India</option>
 </select>
 <div class="small">Goals: <b id="myGoals">0</b></div>
 <div class="small">Shots: <b id="myCount">0</b></div>
</div>

<div id="opponent" class="panel">
 <b>OPPONENT</b>
 <select id="opTeam">
  <option>Real Madrid</option><option>FC Barcelona</option>
  <option>Manchester City</option><option>Liverpool</option>
  <option>Argentina</option><option>Brazil</option>
  <option>France</option><option>Portugal</option><option>India</option>
 </select>
 <div class="small">Goals: <b id="opGoals">0</b></div>
 <div class="small">Shots: <b id="opCount">0</b></div>
</div>

<div id="controls" class="panel">
 <div id="status">Choose a target and take your penalty!</div>
 <div id="instruction">Click inside the goal area to aim.</div>

 <div id="attackControls">
  <label for="power">SHOT POWER</label>
  <input id="power" type="range" min="35" max="100" value="75">
  <div><button id="shoot" class="green">⚽ SHOOT</button></div>
 </div>

 <div id="defendControls">
  <b>GOALKEEPER CONTROLS</b>
  <div class="grid">
   <button data-dive="high-left">↖ HIGH LEFT</button>
   <button data-dive="high-center">↑ HIGH CENTER</button>
   <button data-dive="high-right">HIGH RIGHT ↗</button>
   <button data-dive="low-left">↙ LOW LEFT</button>
   <button data-dive="low-center">↓ LOW CENTER</button>
   <button data-dive="low-right">LOW RIGHT ↘</button>
  </div>
  <div class="small">Choose where to dive before the ball reaches the goal!</div>
 </div>

 <div style="margin-top:5px">
  <button id="sound">🔊 ENABLE SOUND</button>
  <button id="newMatch">↻ NEW MATCH</button>
 </div>
</div>

<script type="module">
import * as THREE from "three";

const $=id=>document.getElementById(id);
const host=$("game");

let scene,camera,renderer,clock;
let player,keeper,ball,aimRing;
let phase="attack",busy=false,matchOver=false;
let myGoals=0,opGoals=0,myCount=0,opCount=0,round=1;
let aimX=0,aimY=1.3;
let startBall=new THREE.Vector3(0,.23,6);
let endBall=new THREE.Vector3();
let shotStarted=0,shotDuration=850;
let shotTarget="",selectedDive="";
let diveLocked=false;
let audioCtx=null,master=null,crowd=null,soundOn=false;
let lastMessage="";

const shirts={
 "FC Barcelona":0xa50044,"Real Madrid":0xf5f5f5,
 "Manchester City":0x5bbcff,"Liverpool":0xc8102e,
 "Argentina":0x80d5ff,"Brazil":0xf2d22c,
 "France":0x17408b,"Portugal":0xb30b31,"India":0xff8b25
};

function material(color,roughness=.8){
 return new THREE.MeshStandardMaterial({color,roughness});
}
function addBox(parent,w,h,d,mat,x,y,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 o.position.set(x,y,z);parent.add(o);return o;
}
function addSphere(parent,r,mat,x,y,z){
 const o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat);
 o.position.set(x,y,z);parent.add(o);return o;
}
function addLine(parent,a,b,color=0xffffff){
 const g=new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(...a),new THREE.Vector3(...b)
 ]);
 parent.add(new THREE.Line(g,new THREE.LineBasicMaterial({color})));
}

function makePerson(x,z,color,isKeeper=false){
 const root=new THREE.Group();
 root.position.set(x,0,z);
 scene.add(root);
 const shirt=material(color),skin=material(0xb9825c);
 const shorts=material(isKeeper?0x252525:0x20242a);
 const socks=material(0xf0f0eb),boots=material(0x151515,.4);
 addSphere(root,.18,skin,0,2.08,0);
 const hair=addSphere(root,.185,material(0x30271e),0,2.16,-.025);
 hair.scale.y=.45;
 addBox(root,.48,.72,.27,shirt,0,1.5,0);
 addBox(root,.43,.25,.28,shorts,0,1.02,0);
 const legs=[],arms=[];
 for(const s of [-1,1]){
  const leg=new THREE.Group();leg.position.set(s*.13,.95,0);root.add(leg);
  addBox(leg,.13,.48,.15,socks,0,-.23,0);
  addBox(leg,.15,.11,.29,boots,0,-.49,-.06);
  legs.push(leg);
  const arm=new THREE.Group();arm.position.set(s*.3,1.72,0);root.add(arm);
  addBox(arm,.13,.48,.14,shirt,0,-.2,0);
  addSphere(arm,.07,skin,0,-.46,0);arms.push(arm);
 }
 root.userData={legs,arms,isKeeper};
 return root;
}

function buildPitch(){
 const dark=material(0x15251c),grass=material(0x197b3e);
 addBox(scene,48,.3,68,dark,0,-.22,-3);
 addBox(scene,40,.15,60,grass,0,-.09,-3);
 for(let i=0;i<10;i++){
  addBox(scene,40,.012,3,material(i%2?0x218647:0x197a3e),0,.0,-29+i*6);
 }
 const white=0xf4f5eb;
 addLine(scene,[-18,.02,20],[18,.02,20],white);
 addLine(scene,[-18,.02,-27],[18,.02,-27],white);
 addLine(scene,[-18,.02,20],[-18,.02,-27],white);
 addLine(scene,[18,.02,20],[18,.02,-27],white);
 addLine(scene,[-10,.025,-18],[-10,.025,-27],white);
 addLine(scene,[10,.025,-18],[10,.025,-27],white);
 addLine(scene,[-10,.025,-27],[10,.025,-27],white);
 const circle=new THREE.Mesh(new THREE.RingGeometry(4.95,5.04,64),
  new THREE.MeshBasicMaterial({color:white,side:THREE.DoubleSide}));
 circle.rotation.x=-Math.PI/2;circle.position.set(0,.02,0);scene.add(circle);
 const post=material(0xffffff,.35);
 addBox(scene,.14,2.7,.14,post,-3.65,1.35,-12);
 addBox(scene,.14,2.7,.14,post,3.65,1.35,-12);
 addBox(scene,7.4,.14,.14,post,0,2.7,-12);
 // Goal net lines
 for(let x=-3.6;x<=3.61;x+=.45){
  addLine(scene,[x,.05,-12.08],[x,2.65,-14.1],0xdce7e0);
 }
 for(let y=.25;y<2.65;y+=.35){
  addLine(scene,[-3.65,y,-12.08],[3.65,y,-12.08],0xdce7e0);
  addLine(scene,[-3.65,y,-12.08],[-3.65,y,-14.1],0xdce7e0);
  addLine(scene,[3.65,y,-12.08],[3.65,y,-14.1],0xdce7e0);
 }
 addSphere(scene,.08,material(white),0,.04,6);
}

function buildStadium(){
 const concrete=material(0x35434a);
 for(const side of [-1,1]){
  addBox(scene,8,7,59,concrete,side*23,3,-3);
  for(let row=0;row<9;row++){
   addBox(scene,7,.2,5.8,material(row%2?0x394d4a:0x293b38),
    side*22,1+row*.65,-29+row*6);
   for(let col=0;col<10;col++){
    const c=[0x164b36,0x1e5441,0x8b3535,0xddd1a1][Math.floor(Math.random()*4)];
    addBox(scene,.25,.28,.26,material(c),side*(19.3+col*.57),
     1.25+row*.65,-29+row*6);
   }
  }
 }
 for(const z of [-32,25]){
  addBox(scene,43,8,7,concrete,0,4,z);
  for(let row=0;row<7;row++){
   for(let col=0;col<32;col++){
    const c=Math.random()>.5?0x1b4a37:0x394e45;
    addBox(scene,.42,.3,.24,material(c),-20+col*1.29,1+row*.8,z);
   }
  }
 }
 const roof=material(0x19282d,.6);
 for(const side of [-1,1]){
  addBox(scene,10,.4,62,roof,side*23,10,-3);
  for(let z=-28;z<25;z+=12)addBox(scene,.22,10,.22,roof,side*18,5,z);
 }
 scene.add(new THREE.HemisphereLight(0xe3f2ff,0x314c35,2));
 const sun=new THREE.DirectionalLight(0xfff3d8,2.5);
 sun.position.set(-12,28,14);scene.add(sun);
 for(const x of [-20,20]){
  for(const z of [-24,15]){
   const light=new THREE.PointLight(0xe2f4ff,55,38);
   light.position.set(x,10,z);scene.add(light);
   addBox(scene,3,.3,.5,material(0xffffff),x,10.2,z);
  }
 }
 scene.background=new THREE.Color(0x82b2d0);
 scene.fog=new THREE.Fog(0x82b2d0,55,110);
}

function makeBall(){
 const g=new THREE.Group();
 addSphere(g,.22,material(0xffffff,.4),0,0,0);
 for(let i=0;i<5;i++){
  const a=i*Math.PI*2/5;
  addSphere(g,.07,material(0x171717),Math.cos(a)*.16,Math.sin(a)*.12,Math.sin(a)*.16);
 }
 scene.add(g);return g;
}
function makeAimRing(){
 const r=new THREE.Mesh(new THREE.RingGeometry(.22,.3,32),
  new THREE.MeshBasicMaterial({color:0x45ff7a,side:THREE.DoubleSide}));
 r.rotation.x=-Math.PI/2;r.position.set(0,.04,-12);scene.add(r);return r;
}
function makeTeams(){
 if(player)scene.remove(player);
 if(keeper)scene.remove(keeper);
 player=makePerson(0,7.4,shirts[$("myTeam").value]||0xa50044);
 keeper=makePerson(0,-11.55,0xe8c52c,true);
 resetBall();
}
function resetBall(){
 ball.position.set(0,.23,6);
 ball.rotation.set(0,0,0);
 aimRing.position.set(aimX,.04,-12);
}
function setStatus(message,instruction=""){
 $("status").textContent=message;
 $("instruction").textContent=instruction;
 lastMessage=message;
}
function speak(message){
 if(!soundOn||!window.speechSynthesis)return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(message);
 u.rate=1.03;u.volume=.9;speechSynthesis.speak(u);
}
function updateUI(){
 $("score").textContent=`${myGoals} - ${opGoals}`;
 $("myGoals").textContent=myGoals;$("opGoals").textContent=opGoals;
 $("myCount").textContent=myCount;$("opCount").textContent=opCount;
 $("round").textContent=matchOver?"MATCH FINISHED":
  `PENALTY SHOOTOUT · ROUND ${Math.min(round,5)} / 5`;
 $("attackControls").style.display=phase==="attack"&&!matchOver?"block":"none";
 $("defendControls").style.display=phase==="defend"&&!matchOver?"block":"none";
 $("shoot").disabled=busy||phase!=="attack"||matchOver;
 document.querySelectorAll("[data-dive]").forEach(b=>{
  b.disabled=busy||phase!=="defend"||matchOver||diveLocked;
 });
}
function soundSetup(){
 if(soundOn)return;
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC){setStatus("Audio is not supported.","");return}
 audioCtx=new AC();
 master=audioCtx.createGain();master.gain.value=.45;
 master.connect(audioCtx.destination);
 crowd=audioCtx.createGain();crowd.gain.value=.055;crowd.connect(master);
 const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);
 const d=buf.getChannelData(0);
 for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*.65;
 const src=audioCtx.createBufferSource();src.buffer=buf;src.loop=true;
 const filter=audioCtx.createBiquadFilter();filter.type="bandpass";filter.frequency.value=450;
 src.connect(filter);filter.connect(crowd);src.start();
 soundOn=true;$("sound").textContent="🔊 SOUND ON";
 setStatus("Stadium sound enabled!","Choose your target to shoot.");
}
function cheer(){
 if(!soundOn||!crowd)return;
 const t=audioCtx.currentTime;
 crowd.gain.cancelScheduledValues(t);
 crowd.gain.setValueAtTime(.05,t);
 crowd.gain.linearRampToValueAtTime(.22,t+.12);
 crowd.gain.linearRampToValueAtTime(.055,t+2);
}
function resetPose(person){
 for(const l of person.userData.legs)l.rotation.set(0,0,0);
 for(const a of person.userData.arms)a.rotation.set(0,0,0);
 person.rotation.set(0,0,0);
}
function kickPose(person){
 person.userData.legs[0].rotation.x=-.9;
 person.userData.legs[1].rotation.x=.3;
 person.userData.arms[0].rotation.z=-.4;
 person.userData.arms[1].rotation.z=.4;
}

function chooseTarget(e){
 if(phase!=="attack"||busy||matchOver)return;
 const rect=renderer.domElement.getBoundingClientRect();
 const nx=(e.clientX-rect.left)/rect.width;
 const ny=(e.clientY-rect.top)/rect.height;
 aimX=THREE.MathUtils.clamp((nx-.5)*8,-3.05,3.05);
 aimY=THREE.MathUtils.clamp((1-ny)*3.0,.35,2.55);
 aimRing.position.set(aimX,.045,-12);
 setStatus("Target selected!","Press SHOOT to take your penalty.");
}

function takeShot(){
 if(phase!=="attack"||busy||matchOver)return;
 soundSetup();
 busy=true;
 shotTarget="";
 phase="attack";
 shotStarted=performance.now();
 shotDuration=1150-Number($("power").value)*4;
 startBall.set(0,.23,6);ball.position.copy(startBall);
 endBall.set(aimX,aimY,-12.5);
 kickPose(player);
 setStatus("You take the penalty!","Watch the shot...");
 updateUI();
}
function playerShotFinished(){
 const inGoal=Math.abs(endBall.x)<3.4&&endBall.y<2.55&&endBall.y>.12;
 const keeperSave=inGoal&&Math.abs(endBall.x-keeper.position.x)<.65&&Math.random()<.72;
 const goal=inGoal&&!keeperSave;
 if(goal){myGoals++;setStatus("GOAL! Brilliant finish!","Now prepare to defend the opponent's penalty.");cheer();}
 else if(keeperSave){setStatus("SAVED BY THE GOALKEEPER!","Next, you will defend the opponent's penalty.");}
 else{setStatus("MISSED!","Next, you will defend the opponent's penalty.");}
 myCount++;resetPose(player);resetPose(keeper);updateUI();
 setTimeout(()=>startOpponentShot(),1200);
}

const zones={
 "high-left":new THREE.Vector3(-2.5,2.25,-12.5),
 "high-center":new THREE.Vector3(0,2.35,-12.5),
 "high-right":new THREE.Vector3(2.5,2.25,-12.5),
 "low-left":new THREE.Vector3(-2.5,.42,-12.5),
 "low-center":new THREE.Vector3(0,.42,-12.5),
 "low-right":new THREE.Vector3(2.5,.42,-12.5)
};
function startOpponentShot(){
 if(matchOver)return;
 phase="defend";busy=true;diveLocked=false;selectedDive="";
 shotTarget=Object.keys(zones)[Math.floor(Math.random()*6)];
 startBall.set(0,.23,6);ball.position.copy(startBall);
 endBall.copy(zones[shotTarget]);
 shotStarted=performance.now();shotDuration=1150;
 kickPose(player);
 setStatus("OPPONENT IS SHOOTING!","Choose a dive direction now!");
 updateUI();
 speak("The opponent takes the penalty. Choose your dive!");
}
function chooseDive(e){
 if(phase!=="defend"||!busy||diveLocked||matchOver)return;
 selectedDive=e.currentTarget.dataset.dive;
 diveLocked=true;
 // Animate keeper toward the selected side and height.
 const d=selectedDive;
 const left=d.endsWith("left"),right=d.endsWith("right");
 keeper.userData.diveX=left?-2.35:right?2.35:0;
 keeper.userData.diveY=d.startsWith("high")?1.15:d.startsWith("low")?.15:.55;
 keeper.userData.diveTime=performance.now();
 keeper.userData.diveStartX=keeper.position.x;
 keeper.userData.diveStartY=keeper.position.y;
 setStatus("You dive "+d.toUpperCase()+"!","Wait for the save result...");
 updateUI();
}
function opponentShotFinished(){
 const correct=selectedDive===shotTarget;
 const saved=correct&&diveLocked;
 if(saved){
  setStatus("WHAT A SAVE! 🧤","You read the shot perfectly!");
  cheer();
 }else{
  opGoals++;
  setStatus("GOAL! The opponent scores.","Choose your next penalty target.");
 }
 opCount++;
 resetPose(player);resetPose(keeper);
 updateUI();
 setTimeout(()=>{
  if(myCount>=5&&opCount>=5&&myGoals!==opGoals){finishMatch();return}
  if(myCount>=5&&opCount>=5&&myGoals===opGoals){
   round=6;
   setStatus("SUDDEN DEATH!","One kick each. You still control every save.");
  }else{
   round=Math.min(5,Math.max(myCount,opCount)+1);
   setStatus("Your turn to shoot!","Click the goal to aim, then press SHOOT.");
  }
  phase="attack";busy=false;diveLocked=false;resetBall();updateUI();
 },1300);
}
function finishMatch(){
 matchOver=true;busy=false;phase="over";
 const result=myGoals>opGoals?"YOU WIN THE MATCH! 🏆":
  myGoals<opGoals?"OPPONENT WINS!":"MATCH DRAW!";
 setStatus(result,"Press NEW MATCH to play again.");
 speak(result);updateUI();
}
function newMatch(){
 myGoals=opGoals=myCount=opCount=0;
 round=1;phase="attack";busy=false;matchOver=false;
 diveLocked=false;selectedDive="";
 makeTeams();resetPose(player);resetPose(keeper);
 setStatus("Choose a target and take your penalty!","Click the goal to aim.");
 updateUI();
}

function animate(){
 requestAnimationFrame(animate);
 const now=performance.now(),dt=clock.getDelta();
 if(player&&!busy)player.position.y=.01+Math.sin(now*.003)*.01;
 if(busy&&shotStarted){
  const t=THREE.MathUtils.clamp((now-shotStarted)/shotDuration,0,1);
  const ease=t*t*(3-2*t);
  ball.position.lerpVectors(startBall,endBall,ease);
  ball.position.y+=Math.sin(t*Math.PI)*.8;
  ball.rotation.x+=dt*8;ball.rotation.z+=dt*5;
  // The goalkeeper responds to the player's dive input.
  if(phase==="defend"&&diveLocked&&keeper.userData.diveTime){
   const k=THREE.MathUtils.clamp((now-keeper.userData.diveTime)/280,0,1);
   keeper.position.x=THREE.MathUtils.lerp(keeper.userData.diveStartX,keeper.userData.diveX,k);
   keeper.position.y=THREE.MathUtils.lerp(keeper.userData.diveStartY,keeper.userData.diveY,k);
   keeper.rotation.z=THREE.MathUtils.lerp(0,keeper.userData.diveX>0?-.9:.9,k);
  }
  if(t>=1){
   shotStarted=0;
   if(phase==="attack")playerShotFinished();
   else if(phase==="defend")opponentShotFinished();
  }
 }
 renderer.render(scene,camera);
}
function resize(){
 if(!renderer||!camera)return;
 const w=host.clientWidth,h=host.clientHeight;
 camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);
}
function init(){
 scene=new THREE.Scene();
 camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,200);
 camera.position.set(0,8.5,24);camera.lookAt(0,2,-4);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
 renderer.shadowMap.enabled=true;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 host.appendChild(renderer.domElement);
 clock=new THREE.Clock();
 buildStadium();buildPitch();
 ball=makeBall();aimRing=makeAimRing();
 makeTeams();updateUI();
 renderer.domElement.addEventListener("pointerdown",chooseTarget);
 $("shoot").addEventListener("click",takeShot);
 $("sound").addEventListener("click",soundSetup);
 $("newMatch").addEventListener("click",newMatch);
 $("myTeam").addEventListener("change",()=>{if(!busy)newMatch()});
 $("opTeam").addEventListener("change",()=>{if(!busy)newMatch()});
 document.querySelectorAll("[data-dive]").forEach(b=>b.addEventListener("click",chooseDive));
 addEventListener("resize",resize);
 resize();animate();
}
try{init()}catch(e){
 console.error(e);
 $("status").textContent="Could not load the 3D game. Check your internet connection.";
 $("instruction").textContent="Reload the page and try again.";
}
</script>
</body>
</html>
