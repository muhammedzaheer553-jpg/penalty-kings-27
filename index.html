<script type="module">
import * as THREE from "three";

const $ = id => document.getElementById(id);
const game = $("game");

let scene,camera,renderer,clock;
let player,keeper,ball,targetMarker;
let playerParts=[],keeperParts=[];
let myScore=0,opScore=0,myShots=0,opShots=0;
let busy=false,matchOver=false,aimX=0,aimY=1.5;
let ballStart=new THREE.Vector3(0,.22,6.2);
let ballEnd=new THREE.Vector3();
let shotStart=0,shotDuration=850,shotKind="";
let audioContext=null,masterGain=null,crowdGain=null,musicTimer=null;
let audioEnabled=false;
let crowdSource=null;
let playerShirt=null;
let keeperHome=new THREE.Vector3(0,0,-11.65);
const teamColors={
 Barcelona:0xa50044,Madrid:0xf1f1f1,City:0x58b7ff,
 Liverpool:0xc8102e,Argentina:0x7ccdf4,Brazil:0xf2d326,
 France:0x183c96,Portugal:0xb50c32,India:0xff8b26
};

function mat(color,roughness=.8,metalness=0){
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}
function box(parent,w,h,d,material,x,y,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 o.position.set(x,y,z);parent.add(o);return o;
}
function sphere(parent,r,material,x,y,z){
 const o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),material);
 o.position.set(x,y,z);parent.add(o);return o;
}
function cylinder(parent,r1,r2,h,material,x,y,z){
 const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,12),material);
 o.position.set(x,y,z);parent.add(o);return o;
}
function line(parent,a,b,color=0xffffff){
 const geo=new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(...a),new THREE.Vector3(...b)
 ]);
 const l=new THREE.Line(geo,new THREE.LineBasicMaterial({color}));
 parent.add(l);return l;
}

function createPerson(x,y,z,shirtColor,isKeeper=false){
 const g=new THREE.Group();g.position.set(x,y,z);scene.add(g);
 const shirt=mat(shirtColor),shorts=mat(isKeeper?0x222222:0x171b24);
 const skin=mat(0xb97d54),socks=mat(isKeeper?0xf4d02b:0xececec);
 const boots=mat(0x171717,.4);
 const torso=cylinder(g,.25,.34,.8,shirt,0,1.45,0);
 torso.scale.x=1.05;
 cylinder(g,.105,.12,.18,skin,0,1.95,0);
 sphere(g,.19,skin,0,2.17,0);
 const hair=sphere(g,.192,mat(0x252019),0,2.26,-.025);
 hair.scale.set(1,.52,1);
 const arms=[],legs=[];
 for(const s of [-1,1]){
  const arm=new THREE.Group();arm.position.set(s*.31,1.72,0);g.add(arm);
  cylinder(arm,.075,.095,.48,shirt,0,-.19,0);
  sphere(arm,.07,skin,0,-.44,0);arms.push(arm);
  const leg=new THREE.Group();leg.position.set(s*.14,1.08,0);g.add(leg);
  cylinder(leg,.095,.115,.53,shorts,0,-.12,0);
  cylinder(leg,.065,.08,.46,socks,0,-.57,0);
  box(leg,.12,.09,.25,boots,0,-.82,-.065);
  legs.push(leg);
 }
 // Player origin is at ground level: feet touch the pitch.
 g.userData={arms,legs,shirt,torso,isKeeper,home:new THREE.Vector3(x,y,z)};
 return g;
}

function buildPitch(){
 const grass=mat(0x16763c);
 box(scene,45,.25,65,mat(0x15251c),0,-.22,-3);
 box(scene,40,.2,60,grass,0,-.1,-3);
 // Alternating mowing stripes
 for(let i=0;i<10;i++){
  box(scene,40,.012,3,mat(i%2?0x197d40:0x218748),0,.008,-29+i*6);
 }
 const white=mat(0xf1f4e8);
 // Pitch boundary and penalty box
 const zFront=20,zBack=-26,xSide=18;
 line(scene,[-xSide,.025,zFront],[xSide,.025,zFront]);
 line(scene,[-xSide,.025,zBack],[xSide,.025,zBack]);
 line(scene,[-xSide,.025,zFront],[-xSide,.025,zBack]);
 line(scene,[xSide,.025,zFront],[xSide,.025,zBack]);
 line(scene,[-18,.026,-20],[18,.026,-20]);
 // Goal and penalty box
 line(scene,[-10,.028,-18],[-10,.028,-27]);
 line(scene,[10,.028,-18],[10,.028,-27]);
 line(scene,[-10,.028,-27],[10,.028,-27]);
 line(scene,[-6,.028,-11],[-6,.028,-18]);
 line(scene,[6,.028,-11],[6,.028,-18]);
 line(scene,[-6,.028,-18],[6,.028,-18]);
 // Center circle
 const circle=new THREE.Mesh(new THREE.RingGeometry(4.98,5.05,64),
  new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}));
 circle.rotation.x=-Math.PI/2;circle.position.set(0,.025,0);scene.add(circle);
 sphere(scene,.12,white,0,.03,0);
 // Goal posts and crossbar
 const post=mat(0xfafafa,.4);
 cylinder(scene,.095,.095,2.6,post,-3.7,1.3,-12.3);
 cylinder(scene,.095,.095,2.6,post,3.7,1.3,-12.3);
 box(scene,7.5,.13,.14,post,0,2.58,-12.3);
 // Net behind goal
 const netMat=new THREE.LineBasicMaterial({color:0xdce8e0,transparent:true,opacity:.5});
 for(let x=-3.5;x<=3.51;x+=.5){
  line(scene,[x,.08,-12.35],[x,2.5,-14.4],0xdce8e0);
 }
 for(let y=.25;y<=2.51;y+=.35){
  line(scene,[-3.7,y,-12.35],[3.7,y,-12.35],0xdce8e0);
  line(scene,[-3.7,y,-12.35],[-3.7,y,-14.4],0xdce8e0);
  line(scene,[3.7,y,-12.35],[3.7,y,-14.4],0xdce8e0);
 }
 for(let z=-12.5;z>=-14.4;z-=.35){
  line(scene,[-3.7,.08,z],[3.7,.08,z],0xdce8e0);
 }
 // Penalty spot
 sphere(scene,.075,white,0,.035,6.2);
}

function buildStadium(){
 // Stadium bowl and stands
 const concrete=mat(0x39454b),seatA=mat(0x183c32),seatB=mat(0x284b42);
 for(const side of [-1,1]){
  const stand=box(scene,8,7,58,concrete,side*23,3.2,-3);
  stand.rotation.z=side*.05;
  for(let row=0;row<10;row++){
   const z=-30+row*5.8;
   box(scene,7,.22,5.4,mat(row%2?0x445058:0x303d43),side*22.5,1.1+row*.56,z);
   for(let col=0;col<12;col++){
    const x=side*(19.5+col*.48);
    const c=Math.random()>.5?seatA:seatB;
    box(scene,.28,.35,.3,c,x,1.35+row*.56,z);
   }
  }
 }
 // End stands behind the goal and at the far end
 for(const z of [-32,25]){
  box(scene,44,8,7,concrete,0,4,z);
  for(let row=0;row<9;row++){
   for(let col=0;col<44;col++){
    const c=Math.random()>.5?seatA:seatB;
    box(scene,.42,.35,.25,c,-21.5+col,1.1+row*.65,z);
   }
  }
 }
 // Roof beams and canopy
 const roof=mat(0x18272b,.6,.25);
 for(const side of [-1,1]){
  box(scene,10,.45,61,roof,side*23,10,-3);
  for(let z=-31;z<27;z+=9){
   cylinder(scene,.15,.15,10,roof,side*18,5,z);
  }
 }
 // Floodlights
 const lamp=mat(0xffffff,.25,.1);
 for(const x of [-20,20]){
  for(const z of [-23,15]){
   box(scene,3,.35,.5,lamp,x,10.2,z);
   const light=new THREE.PointLight(0xc8f3ff,65,38);
   light.position.set(x,9.8,z);scene.add(light);
  }
 }
 // Stadium signs
 const signMat=mat(0x07552c);
 for(const x of [-12,0,12]){
  box(scene,6,.7,.18,signMat,x,.45,-12.0);
 }
 // Sky and lighting
 scene.background=new THREE.Color(0x8eb7d0);
 scene.fog=new THREE.Fog(0x8eb7d0,55,115);
 scene.add(new THREE.HemisphereLight(0xcce7ff,0x29442d,2.1));
 const sun=new THREE.DirectionalLight(0xfff3d7,2.4);
 sun.position.set(-15,28,12);scene.add(sun);
}

function makeBall(){
 const g=new THREE.Group();
 const white=mat(0xf6f5ef,.38);
 const black=mat(0x171a1d,.5);
 sphere(g,.22,white,0,0,0);
 // Simple dark panels
 for(let i=0;i<5;i++){
  const a=i*Math.PI*2/5;
  const p=sphere(g,.075,black,Math.cos(a)*.17,Math.sin(a)*.12,Math.sin(a)*.17);
  p.scale.set(1,1,.5);
 }
 scene.add(g);return g;
}

function createTarget(){
 const ring=new THREE.Mesh(
  new THREE.RingGeometry(.22,.29,32),
  new THREE.MeshBasicMaterial({color:0x48ff82,side:THREE.DoubleSide})
 );
 ring.rotation.x=-Math.PI/2;ring.position.set(0,.04,-12.0);
 scene.add(ring);return ring;
}

function setMessage(text){$("message").textContent=text}
function updateUI(){
 $("score").textContent=`${myScore} — ${opScore}`;
 $("myScore").textContent=myScore;
 $("opScore").textContent=opScore;
 $("myShots").textContent=myShots;
 $("opShots").textContent=opShots;
 const round=Math.min(5,Math.max(myShots,opShots));
 $("sub").textContent=matchOver?"MATCH FINISHED":
  `PENALTY SHOOTOUT · ${round} / 5`;
 $("shoot").disabled=busy||matchOver;
}
function say(text){
 if(!audioEnabled||!("speechSynthesis" in window))return;
 try{
  speechSynthesis.cancel();
  const utter=new SpeechSynthesisUtterance(text);
  utter.rate=1.03;utter.pitch=1.0;utter.volume=.9;
  speechSynthesis.speak(utter);
 }catch(e){}
}
function commentaryForShot(goal){
 const lines=goal?
  ["What a finish! The ball is in the back of the net!","GOAL! Brilliant penalty!","The goalkeeper had no chance!"]:
  ["Saved by the goalkeeper!","Oh, what a save!","The penalty is denied!"];
 say(lines[Math.floor(Math.random()*lines.length)]);
}

function setupAudio(){
 if(audioEnabled)return;
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC){setMessage("Audio is not supported in this browser.");return}
 audioContext=new AC();
 masterGain=audioContext.createGain();
 masterGain.gain.value=.55;
 masterGain.connect(audioContext.destination);
 crowdGain=audioContext.createGain();
 crowdGain.gain.value=.055;
 crowdGain.connect(masterGain);
 // Generated crowd ambience using filtered noise.
 const buffer=audioContext.createBuffer(1,audioContext.sampleRate*2,audioContext.sampleRate);
 const data=buffer.getChannelData(0);
 for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.7;
 crowdSource=audioContext.createBufferSource();
 crowdSource.buffer=buffer;crowdSource.loop=true;
 const filter=audioContext.createBiquadFilter();
 filter.type="bandpass";filter.frequency.value=480;filter.Q.value=.6;
 crowdSource.connect(filter);filter.connect(crowdGain);crowdSource.start();
 audioEnabled=true;
 $("audio").textContent="🔊 SOUND ON";
 musicLoop();
 setMessage("Stadium sound enabled!");
}
function musicLoop(){
 if(!audioEnabled||!audioContext)return;
 const notes=[130.81,164.81,196,246.94,196,164.81];
 let i=0;
 musicTimer=setInterval(()=>{
  if(!audioEnabled||!audioContext)return;
  const osc=audioContext.createOscillator();
  const gain=audioContext.createGain();
  osc.type="triangle";osc.frequency.value=notes[i%notes.length];
  gain.gain.setValueAtTime(.0001,audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(.035,audioContext.currentTime+.05);
  gain.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+.65);
  osc.connect(gain);gain.connect(masterGain);
  osc.start();osc.stop(audioContext.currentTime+.7);i++;
 },700);
}
function cheer(){
 if(!audioEnabled||!audioContext)return;
 const now=audioContext.currentTime;
 crowdGain.gain.cancelScheduledValues(now);
 crowdGain.gain.setValueAtTime(.055,now);
 crowdGain.gain.linearRampToValueAtTime(.22,now+.15);
 crowdGain.gain.linearRampToValueAtTime(.055,now+2.2);
}

function animateKick(person){
 if(!person)return;
 person.userData.legs[0].rotation.x=-1.05;
 person.userData.legs[1].rotation.x=.35;
 person.userData.arms[0].rotation.z=-.55;
 person.userData.arms[1].rotation.z=.55;
}
function resetPerson(person){
 if(!person)return;
 for(const l of person.userData.legs)l.rotation.set(0,0,0);
 for(const a of person.userData.arms)a.rotation.set(0,0,0);
 person.rotation.set(0,0,0);
}

function setTeams(){
 if(player)scene.remove(player);
 if(keeper)scene.remove(keeper);
 player=createPerson(0,0,7.5,teamColors[$("myTeam").value]||0xa50044,false);
 keeper=createPerson(0,0,-11.65,0xe4bd25,true);
 keeper.userData.home=keeperHome.clone();
 playerShirt=player.userData.shirt;
 resetBall();
}
function resetBall(){
 ball.position.copy(ballStart);
 ball.rotation.set(0,0,0);
 if(targetMarker)targetMarker.position.set(aimX,.04,-12);
}
function newMatch(){
 myScore=opScore=myShots=opShots=0;
 busy=false;matchOver=false;
 setTeams();updateUI();
 setMessage("Choose your target and take the shot!");
 $("shoot").disabled=false;
}
function finishMatch(){
 matchOver=true;busy=false;updateUI();
 let msg=myScore>opScore?"YOU WIN! 🏆":myScore<opScore?"OPPONENT WINS":"IT'S A DRAW!";
 setMessage(msg);
 say(msg);
 if(myScore>opScore)cheer();
}

function chooseAim(event){
 if(busy||matchOver)return;
 const rect=renderer.domElement.getBoundingClientRect();
 const nx=(event.clientX-rect.left)/rect.width;
 const ny=(event.clientY-rect.top)/rect.height;
 aimX=THREE.MathUtils.clamp((nx-.5)*8,-3.05,3.05);
 aimY=THREE.MathUtils.clamp((1-ny)*3.1,.45,2.65);
 targetMarker.position.set(aimX,.045,-12.1);
 setMessage("Target selected. Press SHOOT!");
}
function shoot(){
 if(busy||matchOver)return;
 setupAudio();
 busy=true;
 $("shoot").disabled=true;
 shotKind="player";
 shotStart=performance.now();
 shotDuration=1150-(Number($("power").value)*4.7);
 ballStart.set(0,.22,6.2);
 ball.position.copy(ballStart);
 ballEnd.set(aimX,aimY,-12.4);
 animateKick(player);
 keeper.userData.legs[0].rotation.x=-.2;
 keeper.userData.legs[1].rotation.x=.2;
 const diveX=aimX+(Math.random()-.5)*1.8;
 keeper.userData.diveX=THREE.MathUtils.clamp(diveX,-3.1,3.1);
 keeper.userData.diveStart=performance.now();
 setMessage("Here comes the shot...");
 say("The player steps up. Here comes the penalty!");
}
function finishPlayerShot(){
 const x=ballEnd.x,y=ballEnd.y;
 const inGoal=Math.abs(x)<3.45&&y<2.45&&y>.12;
 const keeperDistance=Math.abs(x-keeper.position.x);
 const saved=inGoal&&keeperDistance<.85&&Math.random()<.72;
 const goal=inGoal&&!saved;
 if(goal){myScore++;setMessage("GOAL! What a finish! ⚽");cheer();}
 else if(saved){setMessage("SAVED! Great goalkeeping!");}
 else{setMessage("MISSED! Try the next one!");}
 myShots++;
 commentaryForShot(goal);
 updateUI();
 resetPerson(player);resetPerson(keeper);
 if(myShots>=5&&opShots>=5){
  if(myScore!==opScore){setTimeout(finishMatch,1200);return}
  $("sub").textContent="SUDDEN DEATH";
 }
 setTimeout(opponentKick,1300);
}
function opponentKick(){
 if(matchOver)return;
 shotKind="opponent";busy=true;
 ball.position.copy(ballStart);
 ballStart.set(0,.22,6.2);
 const x=(Math.random()*5.6)-2.8;
 const y=.6+Math.random()*1.8;
 ballEnd.set(x,y,-12.4);
 shotStart=performance.now();shotDuration=850;
 const saved=Math.random()<.31;
 keeper.userData.opponentSave=saved;
 if(saved){
  keeper.userData.diveX=x;
  keeper.userData.diveStart=performance.now();
 }
 setMessage("Opponent takes the penalty...");
 say("The opponent approaches the ball.");
}
function finishOpponentShot(){
 const x=ballEnd.x,y=ballEnd.y;
 const inGoal=Math.abs(x)<3.45&&y<2.45&&y>.12;
 const saved=inGoal&&Math.abs(x)<1.5&&Math.random()<.25;
 const goal=inGoal&&!saved;
 if(goal){opScore++;setMessage("Opponent scores!");}
 else if(saved){setMessage("SAVE! The goalkeeper keeps it out!");}
 else{setMessage("Opponent misses!");}
 opShots++;
 commentaryForShot(!goal);
 if(goal)cheer();
 resetPerson(keeper);resetPerson(player);
 updateUI();
 if(myShots>=5&&opShots>=5&&myScore!==opScore){setTimeout(finishMatch,1200);return}
 if(myShots>=5&&opShots>=5&&myScore===opScore){
  $("sub").textContent="SUDDEN DEATH";
  setMessage("Sudden death! One kick each.");
 }
 busy=false;resetBall();updateUI();
}
function animate(){
 requestAnimationFrame(animate);
 const now=performance.now();
 const dt=clock.getDelta();
 // Subtle idle motion
 if(player&&!busy)player.position.y=.015+Math.sin(now*.003)*.012;
 if(keeper&&!busy){
  keeper.position.x+=(0-keeper.position.x)*Math.min(1,dt*2);
  keeper.rotation.z+=(0-keeper.rotation.z)*Math.min(1,dt*2);
 }
 if(busy&&shotStart){
  const t=THREE.MathUtils.clamp((now-shotStart)/shotDuration,0,1);
  const eased=t*t*(3-2*t);
  ball.position.lerpVectors(ballStart,ballEnd,eased);
  ball.position.y+=Math.sin(t*Math.PI)*1.25;
  ball.rotation.x+=dt*7;ball.rotation.z+=dt*4;
  if(shotKind==="player"&&keeper.userData.diveStart){
   const k=THREE.MathUtils.clamp((now-keeper.userData.diveStart)/400,0,1);
   keeper.position.x=THREE.MathUtils.lerp(0,keeper.userData.diveX,k);
   keeper.rotation.z=THREE.MathUtils.lerp(0,keeper.userData.diveX>0?-.85:.85,k);
  }
  if(t>=1){
   shotStart=0;
   if(shotKind==="player")finishPlayerShot();
   else finishOpponentShot();
  }
 }
 renderer.render(scene,camera);
}
function resize(){
 const w=game.clientWidth,h=game.clientHeight;
 camera.aspect=w/h;camera.updateProjectionMatrix();
 renderer.setSize(w,h);
}
function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x8eb7d0);
 camera=new THREE.PerspectiveCamera(53,innerWidth/innerHeight,.1,200);
 camera.position.set(0,8.5,24);
 camera.lookAt(0,2,-4);
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.1;
 game.appendChild(renderer.domElement);
 clock=new THREE.Clock();
 buildStadium();buildPitch();
 ball=makeBall();
 targetMarker=createTarget();
 setTeams();updateUI();
 renderer.domElement.addEventListener("pointerdown",chooseAim);
 $("shoot").addEventListener("click",shoot);
 $("audio").addEventListener("click",setupAudio);
 $("new").addEventListener("click",newMatch);
 $("myTeam").addEventListener("change",()=>{if(!busy)newMatch()});
 $("opTeam").addEventListener("change",()=>{if(!busy)newMatch()});
 addEventListener("resize",resize);
 resize();
 $("loading").style.display="none";
 animate();
}
try{init()}catch(err){
 console.error(err);
 $("loading").style.display="grid";
 $("loading").innerHTML="<div><h2>Unable to load 3D game</h2><p>Check your internet connection and browser WebGL support.</p><p>"+String(err.message)+"</p></div>";
}
</script>
